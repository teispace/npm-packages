<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  For the Linux Playwright image only (FONTCONFIG_FILE, set by visual.mjs and
  CI). The image maps system-ui and sans-serif to a CJK font with no bold face, so pixel
  baselines would show every weight as regular; a desktop maps it to a full
  family, as this does.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
